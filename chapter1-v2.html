<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16335B">
<title>פרק 1 · אריזה — V2 · אצל משפחת גלבוע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Suez+One&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16335B; --navy-2:#1E4378;
  --orange:#F0833A; --orange-d:#D96A1F;
  --cyan:#3FA9F5;
  --cream:#F7F4EF; --paper:#FFFFFF;
  --ink:#1B2942; --ink-soft:#5A6B86;
  --line:#E4DED3;
  --good:#2BA66B; --good-bg:#E7F6EE;
  --bad:#D8443B;  --bad-bg:#FCEBEA;
  --cardboard:#C8A06E;
  --cardboard-d:#A67E4C;
  --tape:#FFE39A;
  --sticky-yellow:#FFF1A8;
  --stamp-red:#C8413A;
  --shadow:0 8px 28px rgba(22,51,91,.12);
  --shadow-sm:0 3px 12px rgba(22,51,91,.08);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Heebo',sans-serif;background:var(--navy);color:var(--ink);display:flex;justify-content:center;overscroll-behavior:none;line-height:1.5;-webkit-user-select:none;user-select:none;}
img{max-width:100%;display:block;pointer-events:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.display-font{font-family:'Suez One',serif;letter-spacing:-.01em;}
.hand-font{font-family:'Caveat',cursive;}

#app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;background:var(--cream);display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,.4);overflow:hidden;}

/* ===== TASK HEADER ===== */
#topbar{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;position:sticky;top:0;z-index:40;}
.task-row{display:flex;align-items:center;gap:10px;}
.task-logo{width:40px;height:40px;border-radius:11px;background:#fff;padding:3px;flex-shrink:0;box-shadow:var(--shadow-sm);}
.task-meta{flex:1;min-width:0;}
.task-id{font-weight:900;font-size:14px;line-height:1.15;display:flex;align-items:center;gap:6px;}
.beta-badge{background:var(--orange);color:#fff;font-size:9px;padding:2px 7px;border-radius:30px;font-weight:900;letter-spacing:.04em;}
.task-route{font-size:11.5px;color:#A9C2E6;font-weight:500;margin-top:1px;}
.task-clock{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:4px 10px;text-align:center;flex-shrink:0;}
.task-clock .t{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;}
.task-clock .l{font-size:9px;color:#A9C2E6;font-weight:600;margin-top:-1px;}

#road{position:relative;height:30px;margin:8px 4px 0;}
.road-line{position:absolute;top:50%;right:0;left:0;height:5px;transform:translateY(-50%);background:rgba(255,255,255,.13);border-radius:5px;overflow:hidden;}
.road-fill{position:absolute;top:0;right:0;height:100%;background:linear-gradient(90deg,var(--orange),var(--cyan));border-radius:5px;transition:width .55s cubic-bezier(.4,1.3,.5,1);}
.road-dot{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:#fff;transform:translate(50%,-50%);opacity:.5;}
.road-dot.right{right:0;} .road-dot.left{left:0;}
.road-city{position:absolute;top:-1px;font-size:9px;color:#A9C2E6;font-weight:700;}
.road-city.r{right:0;} .road-city.l{left:0;}
#truck{position:absolute;top:50%;transform:translate(50%,-58%) scaleX(-1);font-size:20px;transition:right .55s cubic-bezier(.4,1.3,.5,1);z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));}

/* ===== SCREEN ===== */
#screen{flex:1;display:flex;flex-direction:column;animation:fadeUp .4s ease;position:relative;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.scr{padding:16px 16px 22px;display:flex;flex-direction:column;gap:14px;flex:1;}

/* ===== TYPOGRAPHY ===== */
.eyebrow{font-size:11px;font-weight:900;color:var(--orange);letter-spacing:.07em;text-transform:uppercase;}
h2.title{font-family:'Suez One',serif;font-size:26px;font-weight:400;color:var(--navy);line-height:1.2;letter-spacing:-.01em;}
.lead{font-size:16px;line-height:1.65;color:var(--ink);}
.lead b{color:var(--navy);}
.muted{color:var(--ink-soft);font-size:14.5px;line-height:1.6;}

/* ===== STICKY NOTE (family welcome) ===== */
.welcome-stage{position:relative;padding:16px;display:flex;flex-direction:column;gap:14px;}
.door-photo{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:#1a2b40;height:240px;}
.door-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.door-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(11,24,46,.5));}
.door-num{position:absolute;top:14px;right:14px;background:var(--navy);color:#fff;padding:7px 13px;border-radius:9px;font-weight:900;font-size:14px;box-shadow:var(--shadow-sm);transform:rotate(-3deg);}
.door-name{position:absolute;bottom:14px;right:14px;color:#fff;font-family:'Suez One',serif;font-size:22px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
.door-name small{display:block;font-family:'Heebo',sans-serif;font-size:11.5px;color:#FFB87E;font-weight:700;letter-spacing:.04em;}

.sticky{
  position:relative;background:var(--sticky-yellow);
  padding:18px 16px 16px;
  font-family:'Caveat',cursive;font-size:21px;line-height:1.35;color:#3D2D0C;
  box-shadow:0 8px 20px rgba(120,90,30,.22),0 2px 4px rgba(120,90,30,.15);
  transform:rotate(-1.5deg);
  border-radius:2px 14px 6px 10px;
  background-image:linear-gradient(140deg, rgba(255,255,255,.4), transparent 30%, transparent 70%, rgba(160,120,30,.05));
}
.sticky::before{
  content:"";position:absolute;top:-9px;right:38%;left:38%;height:18px;
  background:rgba(220,180,80,.55);transform:rotate(2deg);
  box-shadow:0 2px 4px rgba(0,0,0,.12);
  border-radius:2px;
}
.sticky strong{font-weight:700;}
.sticky-sig{font-size:24px;text-align:left;margin-top:6px;color:#5A3A12;}

/* ===== CARDBOARD ===== */
.cardboard{
  background:var(--cardboard);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 4px),
    radial-gradient(ellipse 80% 60% at 30% 20%, rgba(255,255,255,.12), transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%, rgba(0,0,0,.08), transparent);
  color:#3A2410;
  border-radius:14px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.12), 0 6px 20px rgba(140,90,40,.25);
}

/* ===== TAPE STRIP (decorative) ===== */
.tape{position:absolute;background:linear-gradient(180deg,rgba(255,235,150,.55),rgba(255,215,100,.78));box-shadow:0 1px 3px rgba(0,0,0,.15);}
.tape::after,.tape::before{content:"";position:absolute;width:5px;height:100%;top:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.1));}
.tape::after{right:-1px;background:linear-gradient(-90deg,transparent,rgba(0,0,0,.1));}
.tape.h{height:18px;left:-8px;right:-8px;}
.tape.v{width:18px;top:-8px;bottom:-8px;}

/* ===== STAMP ===== */
.stamp{
  position:absolute;color:var(--stamp-red);font-family:'Suez One',serif;font-size:18px;
  border:3px solid var(--stamp-red);padding:6px 12px;border-radius:6px;
  transform:rotate(-12deg);opacity:0;letter-spacing:.05em;
  background:rgba(252,235,234,.4);
  text-shadow:1px 0 0 rgba(200,65,58,.3);
  font-weight:400;
}
.stamp.show{animation:stampDown .55s cubic-bezier(.5,1.7,.5,1) forwards;}
@keyframes stampDown{0%{opacity:0;transform:rotate(-12deg) scale(3);}55%{opacity:1;transform:rotate(-12deg) scale(.92);}80%{transform:rotate(-12deg) scale(1.06);}100%{opacity:1;transform:rotate(-12deg) scale(1);}}

/* ===== GRABBY CHARACTER ===== */
#grabby{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(120%);
  width:min(420px,calc(100% - 24px));z-index:60;
  display:flex;gap:11px;align-items:flex-end;
  pointer-events:none;transition:transform .45s cubic-bezier(.4,1.5,.5,1);
}
#grabby.on{transform:translateX(-50%) translateY(0);pointer-events:auto;}
.gb-av{width:62px;height:62px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 6px 18px rgba(22,51,91,.25);flex-shrink:0;border:2px solid #fff;}
.gb-av img{border-radius:50%;}
.gb-bubble{
  position:relative;background:#fff;padding:11px 14px 12px;border-radius:16px;
  box-shadow:0 8px 24px rgba(22,51,91,.22);
  border:1px solid var(--line);flex:1;min-width:0;
}
.gb-bubble::after{
  content:"";position:absolute;bottom:14px;right:-7px;
  width:14px;height:14px;background:#fff;transform:rotate(45deg);
  border-right:1px solid var(--line);border-top:1px solid var(--line);
}
.gb-name{font-weight:900;color:var(--orange);font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
.gb-text{font-size:14.5px;line-height:1.5;color:var(--ink);margin-top:2px;}
.gb-text b{color:var(--navy);}
.gb-x{position:absolute;top:6px;left:8px;width:22px;height:22px;border-radius:50%;background:var(--cream);color:var(--ink-soft);font-size:14px;font-weight:900;display:grid;place-items:center;line-height:1;}

/* ===== PHOTO MARKER (mark fragile items) ===== */
.pm-stage{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:#000;}
.pm-img{display:block;width:100%;height:auto;touch-action:none;}
.pm-counter{position:absolute;top:10px;right:10px;background:rgba(11,24,46,.78);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:30px;backdrop-filter:blur(4px);display:flex;align-items:center;gap:7px;}
.pm-counter .ic{font-size:14px;}
.pm-circle{position:absolute;width:80px;height:80px;border-radius:50%;border:4px solid var(--orange);transform:translate(50%,-50%) scale(0);pointer-events:none;animation:circleIn .45s cubic-bezier(.5,1.4,.5,1) forwards;box-shadow:0 0 0 2px rgba(240,131,58,.3),0 4px 12px rgba(0,0,0,.4);}
.pm-circle::after{content:"";position:absolute;inset:-4px;border:4px solid transparent;border-top-color:rgba(240,131,58,.5);border-radius:50%;animation:spin 1.4s linear infinite;}
@keyframes circleIn{to{transform:translate(50%,-50%) scale(1);}}
@keyframes spin{to{transform:rotate(360deg);}}
.pm-circle.done{border-color:var(--good);box-shadow:0 0 0 2px rgba(43,166,107,.3),0 4px 12px rgba(0,0,0,.4);}
.pm-circle.done::after{display:none;}
.pm-label{position:absolute;background:#fff;color:var(--navy);font-weight:900;font-size:12px;padding:4px 9px;border-radius:6px;box-shadow:var(--shadow-sm);white-space:nowrap;animation:fadeUp .3s .25s both;}
.pm-miss{position:absolute;color:rgba(255,255,255,.85);font-size:24px;font-weight:900;transform:translate(50%,-50%);pointer-events:none;animation:missX .8s ease-out forwards;text-shadow:0 0 6px rgba(0,0,0,.6);}
@keyframes missX{0%{opacity:0;transform:translate(50%,-50%) scale(0);}30%{opacity:1;transform:translate(50%,-50%) scale(1.4);}100%{opacity:0;transform:translate(50%,-50%) scale(1.1);}}
.pm-hint{font-size:13px;color:var(--ink-soft);font-weight:600;text-align:center;}

/* ===== PACK-REAL-BOX ===== */
.pb-stage{display:flex;flex-direction:column;gap:14px;}
.pb-box{position:relative;height:230px;border-radius:0;}
.pb-box .box-inner{
  position:absolute;inset:35px 10px 10px;
  background:linear-gradient(180deg,#8A6440,#7A5630);
  border-radius:4px 4px 8px 8px;
  box-shadow:inset 0 14px 22px rgba(0,0,0,.4), inset 0 -6px 14px rgba(0,0,0,.25);
  overflow:hidden;
}
.pb-box .box-flap-back{
  position:absolute;top:0;left:0;right:0;height:80px;
  background:linear-gradient(180deg,#C39060 0%,#A87545 100%);
  border-radius:6px 6px 0 0;
  clip-path:polygon(0 0, 100% 0, 90% 100%, 10% 100%);
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.15);
}
.pb-box .box-front{
  position:absolute;left:0;right:0;bottom:0;height:120px;
  background:linear-gradient(180deg,#C8A06E,#A67E4C);
  border-radius:0 0 8px 8px;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 1px,transparent 1px 4px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 6px 12px rgba(0,0,0,.18);
}
.pb-box .box-label{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%) rotate(-1deg);
  background:#fff;padding:6px 14px;font-family:'Caveat',cursive;font-size:18px;color:#3A2410;font-weight:700;
  box-shadow:0 2px 5px rgba(0,0,0,.15);
}
.pb-stack{position:absolute;bottom:18px;left:0;right:0;height:96px;display:flex;flex-direction:column-reverse;align-items:center;gap:0;padding:0 22px;}
.pb-stack-item{
  width:80%;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:800;color:#fff;
  text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.3);transition:transform .4s cubic-bezier(.4,1.3,.5,1);
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.pb-stack-item .it{font-size:18px;}
.pb-shelf{
  background:#F3EBDA;border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:9px;
  box-shadow:inset 0 0 0 1px var(--line);
  border:1px dashed rgba(166,126,76,.4);
}
.pb-shelf-h{font-size:11.5px;font-weight:900;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
.pb-item{
  display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;box-shadow:var(--shadow-sm);touch-action:none;cursor:grab;
  position:relative;
}
.pb-item.dragging{cursor:grabbing;z-index:999;transition:none;box-shadow:0 12px 30px rgba(22,51,91,.3);}
.pb-item.placed{opacity:0;transform:scale(.7);transition:.3s;pointer-events:none;}
.pb-item img{width:46px;height:46px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
.pb-item .name{flex:1;font-weight:800;font-size:14px;color:var(--ink);}
.pb-item .weight{background:var(--cream);font-size:11px;font-weight:900;color:var(--ink-soft);padding:4px 8px;border-radius:6px;display:flex;gap:4px;align-items:center;}

.pb-box.drophover .box-front{box-shadow:inset 0 0 0 3px var(--orange),inset 0 6px 12px rgba(240,131,58,.4);}
.pb-box.shaking{animation:boxShake .5s ease-in-out;}
@keyframes boxShake{0%,100%{transform:translateX(0) rotate(0);}20%{transform:translateX(-8px) rotate(-1.5deg);}50%{transform:translateX(7px) rotate(1.2deg);}80%{transform:translateX(-4px) rotate(-.5deg);}}

.btn-seal{
  background:var(--navy);color:#fff;border-radius:13px;padding:14px;
  font-weight:900;font-size:15px;width:100%;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-seal:disabled{background:#C9C2B0;}
.btn-seal:not(:disabled):active{transform:scale(.98);}

/* tape across the closed box */
.pb-box .seal-tape{
  position:absolute;top:32px;left:50%;width:40%;height:18px;
  background:linear-gradient(180deg,rgba(255,228,140,.85),rgba(240,200,80,.9));
  transform:translateX(-50%) scaleY(0);transform-origin:top;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  z-index:5;
}
.pb-box.sealed .seal-tape{animation:tapeDown .35s ease-out forwards;}
@keyframes tapeDown{to{transform:translateX(-50%) scaleY(1);}}
.pb-box.sealed .box-stamp{animation:stampDown .55s .35s cubic-bezier(.5,1.7,.5,1) forwards;}
.pb-box .box-stamp{position:absolute;top:78px;left:20%;color:var(--stamp-red);font-family:'Suez One',serif;font-size:16px;border:3px solid var(--stamp-red);padding:5px 11px;border-radius:5px;transform:rotate(-12deg) scale(3);opacity:0;background:rgba(252,235,234,.55);z-index:6;letter-spacing:.05em;}

/* ===== AUDIO RESKIN (cardboard boxes) ===== */
.audio-row{display:flex;gap:11px;}
.audio-c{flex:1;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:0;display:flex;flex-direction:column;gap:0;align-items:stretch;transition:.18s;overflow:hidden;}
.audio-c.correct{border-color:var(--good);}
.audio-c.wrong{border-color:var(--bad);}
.audio-box-3d{height:88px;position:relative;overflow:hidden;border-radius:14px 14px 0 0;}
.audio-box-3d .top{position:absolute;top:0;left:0;right:0;height:30%;background:linear-gradient(180deg,#C8A06E,#A87B49);clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);box-shadow:inset 0 -2px 4px rgba(0,0,0,.2);}
.audio-box-3d .front{position:absolute;bottom:0;left:0;right:0;height:75%;background:linear-gradient(180deg,#B68850,#8A6238);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 4px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.audio-box-3d .lbl{position:absolute;bottom:10px;left:50%;transform:translateX(-50%) rotate(-2deg);background:#fff;font-family:'Caveat',cursive;font-size:14px;font-weight:700;color:#3A2410;padding:2px 10px;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.audio-c.shaking .audio-box-3d{animation:boxShake .55s ease-in-out;}
.audio-name{padding:10px 8px 4px;font-weight:900;color:var(--navy);font-size:13.5px;text-align:center;}
.audio-actions{padding:8px 10px 12px;display:flex;flex-direction:column;gap:7px;}
.btn-play{background:var(--navy);color:#fff;border-radius:10px;padding:8px;font-weight:800;font-size:12.5px;display:flex;gap:5px;align-items:center;justify-content:center;}
.btn-play.playing{background:var(--orange);}
.btn-pick{background:var(--cream);border:2px solid var(--line);border-radius:10px;padding:8px;font-weight:800;font-size:12.5px;color:var(--navy);}

/* ===== TV LAYERS ===== */
.tv-stage{background:linear-gradient(180deg,#F0EAD9 50%,#D8C9A6);border-radius:14px;padding:18px;position:relative;overflow:hidden;border:1px solid var(--line);}
.tv-stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.12));}
.tv-frame{
  position:relative;width:84%;height:160px;margin:0 auto;
  background:#1a1a1a;border-radius:6px;border:4px solid #0d0d0d;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
  z-index:1;
}
.tv-frame::after{content:"";position:absolute;inset:8px;background:radial-gradient(ellipse at center,#2a2a2a,#0a0a0a);border-radius:3px;}
.tv-stand{width:48%;height:14px;margin:6px auto 0;background:linear-gradient(180deg,#2a2a2a,#0a0a0a);border-radius:3px;}
/* layer overlays */
.tv-layer{position:absolute;inset:-8px;border-radius:8px;opacity:0;transition:opacity .35s ease;pointer-events:none;}
.tv-layer.on{opacity:1;}
.tv-layer.L1{background:repeating-linear-gradient(45deg,#dadada 0 4px,#c0c0c0 4px 8px);inset:-6px;border-radius:6px;opacity:0;}
.tv-layer.L1.on{opacity:.55;}
.tv-layer.L2{background:linear-gradient(180deg,#C8A06E,#A67E4C);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 5px);border-radius:8px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);inset:-12px;}
.tv-layer.L3{background:radial-gradient(circle at 6px 6px, rgba(255,255,255,.5) 2px, transparent 3px),radial-gradient(circle at 6px 6px, rgba(255,255,255,.5) 2px, transparent 3px);background-size:10px 10px,10px 10px;background-color:rgba(220,220,235,.7);background-position:0 0,5px 5px;inset:-18px;border-radius:14px;}
.tv-layer.L4{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.25));inset:-22px;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);}
.tv-layer.L5{display:flex;align-items:center;justify-content:center;}
.tv-layer.L5 .fragile-sticker{
  position:absolute;top:-18px;left:14px;background:var(--stamp-red);color:#fff;
  font-family:'Suez One',serif;font-size:11px;padding:4px 9px;border-radius:3px;
  transform:rotate(-6deg);box-shadow:0 2px 5px rgba(0,0,0,.3);opacity:0;
  letter-spacing:.05em;
}
.tv-layer.L5.on .fragile-sticker{animation:stickerStick .35s ease-out forwards;}

   GRABBY — recurring mentor character
   ============================================================ */
const gbEl = document.getElementById('grabby');
const gbText = document.getElementById('gbText');
let gbTimer = null;
function grabby(text, ms=8500){
  gbText.innerHTML = text;
  gbEl.classList.add('on');
  clearTimeout(gbTimer);
  gbTimer = setTimeout(()=>gbEl.classList.remove('on'), ms);
}
document.getElementById('gbX').onclick = ()=>{ gbEl.classList.remove('on'); clearTimeout(gbTimer); };

/* ============================================================
   POINTER-EVENT DRAG (mobile + desktop)
   ============================================================ */
function makeDraggable(el, zones, opts={}){
  let startX, startY, dragging=false, origTransform='', pointerId=null;
  el.addEventListener('pointerdown', e=>{
    if(el.classList.contains('placed') || el.classList.contains('matched')) return;
    e.preventDefault();
    pointerId = e.pointerId;
    el.setPointerCapture(pointerId);
    startX = e.clientX; startY = e.clientY;
    dragging = true;
    el.classList.add('dragging');
    origTransform = el.style.transform || '';
    opts.onPickup && opts.onPickup(el);
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging || e.pointerId!==pointerId) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(1.06) rotate(2deg)`;
    const over = hitZone(e.clientX, e.clientY, zones);
    zones.forEach(z=>z.el.classList.toggle('dropok', z===over));
    zones.forEach(z=>z.el.classList.toggle('drophover', z===over));
  });
  function endDrag(e){
    if(!dragging) return;
    dragging=false;
    try{ el.releasePointerCapture(pointerId); }catch(_){}
    el.classList.remove('dragging');
    const over = hitZone(e.clientX, e.clientY, zones);
    zones.forEach(z=>{z.el.classList.remove('dropok');z.el.classList.remove('drophover');});
    if(over){
      try{ navigator.vibrate && navigator.vibrate(18); }catch(_){}
      const handled = opts.onDrop && opts.onDrop(over, el);
      if(handled === false){
        // bounce back
        el.style.transition = 'transform .35s cubic-bezier(.5,1.6,.5,1)';
        el.style.transform = origTransform;
        setTimeout(()=>el.style.transition='', 360);
      }
    } else {
      el.style.transition = 'transform .35s cubic-bezier(.5,1.6,.5,1)';
      el.style.transform = origTransform;
      setTimeout(()=>el.style.transition='', 360);
    }
  }
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}
function hitZone(x, y, zones){
  for(const z of zones){
    const r = z.el.getBoundingClientRect();
    if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return z;
  }
  return null;
}

let idx=0, maxIdx=0;
const done={};
const screenEl = document.getElementById('screen');
const stepsRail = document.getElementById('stepsRail');
const btnNext = document.getElementById('btnNext');
const btnBack = document.getElementById('btnBack');
const lockTip = document.getElementById('locktip');
const TOTAL = SCREENS.length;
const PASSIVE = ['welcome','postcard'];
function isComplete(i){return PASSIVE.includes(SCREENS[i].type) || !!done[i];}
function el(tag, cls, html){const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;}

function render(){
  const s = SCREENS[idx];
  screenEl.innerHTML='';
  screenEl.style.animation='none'; void screenEl.offsetWidth; screenEl.style.animation='';
  (RENDER[s.type])(s, screenEl);
  document.getElementById('clock').textContent = s.time;
  updateChrome();
  window.scrollTo({top:0,behavior:'instant'});
}
function updateChrome(){
  const pct = TOTAL>1 ? (idx/(TOTAL-1))*100 : 0;
  document.getElementById('roadFill').style.width = pct+'%';
  document.getElementById('truck').style.right = pct+'%';
  stepsRail.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d = el('div','step-dot');
    if(i<idx) d.classList.add('done');
    else if(i===idx) d.classList.add('on');
    stepsRail.appendChild(d);
  }
  btnBack.disabled = idx===0;
  const complete = isComplete(idx), last = idx===TOTAL-1;
  btnNext.disabled = !complete || last;
  btnNext.textContent = last ? '🎉 סיימת את הפרק' : 'התקדם ⟵';
  lockTip.textContent = (!complete && !last) ? 'השלימו את המשימה כדי להמשיך' : '';
  lockTip.style.display = lockTip.textContent ? 'block' : 'none';
}
function nextScr(){if(idx<TOTAL-1 && isComplete(idx)){idx++;if(idx>maxIdx)maxIdx=idx;render();}}
function prevScr(){if(idx>0){idx--;render();}}
function markDone(){done[idx]=true;updateChrome();}
btnNext.onclick = nextScr; btnBack.onclick = prevScr;

/* ---- MARK FRAGILE on photo ---- */
RENDER.markphoto = (s, root)=>{
  const scr = el('div','scr');
  scr.innerHTML = `<div><div class="eyebrow">${s.eyebrow}</div>
    <h2 class="title" style="margin-top:6px">${s.q}</h2>
    <p class="muted" style="margin-top:6px">${s.sub}</p></div>`;
  const stage = el('div','pm-stage');
  const img = el('img','pm-img');img.src = IMG+s.img;img.alt='';
  stage.appendChild(img);
  const counter = el('div','pm-counter','<span class="ic">🎯</span><span><b>0</b> / '+s.spots.length+'</span>');
  stage.appendChild(counter);
  const found = new Set();
  stage.addEventListener('pointerdown', e=>{
    if(done[idx])return;
    const r = stage.getBoundingClientRect();
    const xPct = ((e.clientX - r.left) / r.width) * 100;
    const yPct = ((e.clientY - r.top) / r.height) * 100;
    // RTL: convert clientX→right-based for matching spots which are right-based
    const xRight = 100 - xPct;
    // check spots
    let hit = null;
    s.spots.forEach((sp,i)=>{
      if(found.has(i)) return;
      const dx = xRight - sp.x, dy = yPct - sp.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(dist <= sp.r) hit = {sp, i};
    });
    if(hit){
      found.add(hit.i);
      const c = el('div','pm-circle');
      c.style.right = hit.sp.x+'%';
      c.style.top = hit.sp.y+'%';
      const label = el('div','pm-label',hit.sp.name);
      label.style.right = hit.sp.x+'%';
      label.style.top = (hit.sp.y+10)+'%';
      stage.appendChild(c); stage.appendChild(label);
      setTimeout(()=>c.classList.add('done'),1100);
      try{ ac().resume(); snap(); }catch(_){}
      try{ navigator.vibrate && navigator.vibrate(18); }catch(_){}
      counter.querySelector('b').textContent = found.size;
      if(found.size===s.spots.length){
        grabby(s.done, 6000);
        if(!done[idx]) markDone();
      } else {
        if(found.size===1) grabby(s.grabbyHit, 4500);
      }
    } else {
      const m = el('div','pm-miss','✕');
      m.style.right = xRight+'%';
      m.style.top = yPct+'%';
      stage.appendChild(m);
      setTimeout(()=>m.remove(),900);
      grabby(s.grabbyMiss, 4500);
    }
  });
  scr.appendChild(stage);
  scr.appendChild(el('div','pm-hint','💡 געו בנקודות בסלון של גלבוע'));
  root.appendChild(scr);
};

  stage.appendChild(sealBtn);

  scr.appendChild(stage);
  root.appendChild(scr);

  // wiring drag
  const stack = box.querySelector('#pbStack');
  const placedOrder = [];   // array of item ids in drop order
  const zones = [{el: box, kind:'box'}];
  shelf.querySelectorAll('.pb-item').forEach(card=>{
    const it = s.items.find(x=>x.id===card.dataset.id);
    makeDraggable(card, zones, {
      onDrop:(zone, el)=>{
        if(zone.kind==='box'){
          card.classList.add('placed');
          placedOrder.push(it.id);
          // add a visual block to the stack
          const blk = el2 => null;
          const block = document.createElement('div');
          block.className = 'pb-stack-item';
          block.style.background = it.color;
          block.innerHTML = `<span class="it">${it.id==='sculpt'?'🗿':it.id==='mirror'?'🪞':'🍷'}</span>${it.name}`;
          stack.appendChild(block);
          try{ ac().resume(); thud(); }catch(_){}
          try{ navigator.vibrate && navigator.vibrate(25); }catch(_){}

    });

    // expected order in placedOrder: heaviest first → sculpt, mirror, glass
    const expected = ['sculpt','mirror','glass'];
    const correct = placedOrder.every((id,i)=> id===expected[i]);
    if(correct){
      box.classList.add('sealed');
      try{ tape(); setTimeout(()=>thud(), 250); }catch(_){}
      try{ navigator.vibrate && navigator.vibrate([30,60,30]); }catch(_){}

      if(!done[idx]) setTimeout(markDone, 800);

      // wrong → shake, items "shift", reset
      box.classList.add('shaking');
      try{ rattle(); }catch(_){}
      try{ navigator.vibrate && navigator.vibrate([60,40,60,40,60]); }catch(_){}
      grabby(s.errGrabby, 7000);
      setTimeout(()=>{
        box.classList.remove('shaking');
        stack.innerHTML='';
        placedOrder.length = 0;
        shelf.querySelectorAll('.pb-item').forEach(c=>{
          c.classList.remove('placed');
          c.style.transform='';
          c.style.transition='';
        });
        sealBtn.disabled = true;
      }, 1200);
    }
  };
};

    </div>
    <div class="pc-stamps" id="pcStamps"></div>
    <div class="pc-sig">— צוות Grabit 🚚</div>
  `;
  scr.appendChild(card);

  const stamps = [
    {ic:'🍷', t:'שבירים — עוטפים, מקבעים'},
    {ic:'🔌', t:'חשמל — 5 שכבות הגנה'},
    {ic:'📦', t:'קרטונים — 4 סימונים'},
    {ic:'⭐', t:'מיוחדים — פתרון לכל אחד'}
  ];
  const stampsEl = card.querySelector('#pcStamps');
  stamps.forEach((st,i)=>{
    const s = el('div','pc-stamp');
    s.style.animationDelay = (0.6 + i*0.35) + 's';
    s.innerHTML = `<span>${st.ic}</span><span>${st.t}</span>`;
    stampsEl.appendChild(s);
  });

  root.appendChild(scr);
  setTimeout(()=>grabby('<b>ארזת בית של משפחה.</b> הם סומכים עלייך. נסיעה בטוחה לחיפה. 🚚', 10000), 1500);
};

/* BOOT */
render();
</script>
</body>
</html>
